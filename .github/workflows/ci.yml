name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install TypeScript (the only tool the repo needs)
        run: npm install -g typescript@6.0.2
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests and Act 1 bot playthrough
        run: npm test
      - name: Build
        run: npm run build
      - name: Balance report
        run: node scripts/balance.ts 20
  smoke:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g typescript@6.0.2
      - run: npm run build
      - name: Install Playwright Chromium
        run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: node scripts/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: smoke/
